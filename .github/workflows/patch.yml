name: patch

on:
  push:
    tags:
      - "v*-hotfix*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Shorebird release version to patch, or latest
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: patch-${{ github.ref }}
  cancel-in-progress: false

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  SHOREBIRD_RELEASE_VERSION: ${{ inputs.release_version || 'latest' }}

jobs:
  android:
    name: Android patch
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore_path="$RUNNER_TEMP/panwise-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore_path"
          } > android/key.properties

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Create Dart-only Shorebird patch
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ env.SHOREBIRD_RELEASE_VERSION }}
          working-directory: app
          args: >-
            --flavor=prod
            --target=lib/main_prod.dart

  ios:
    name: iOS patch
    runs-on: macos-latest
    environment: prod
    env:
      APP_BUNDLE_ID: app.panwise
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app/ios

      - name: Create Dart-only Shorebird patch
        working-directory: app/ios
        run: bundle exec fastlane ios patch_shorebird

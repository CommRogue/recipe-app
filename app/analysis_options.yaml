# flutter_lints is the Flutter team's recommended set. riverpod_lint is not
# used: its custom_lint dependency pinned an analyzer that could not compile
# the freezed output on Dart 3.13 (see the #17 resolution).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore # freezed + json_serializable

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    directives_ordering: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    unawaited_futures: true
